# Supervisor Configuration File for FlowCRM Queue Worker & IMAP Sync
# Place this file in /etc/supervisor/conf.d/flowcrm-worker.conf on your Linux server

[program:flowcrm-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/flowcrm/backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/flowcrm/backend/storage/logs/worker.log
stopwaitsecs=3600

# Command to reload supervisor:
# sudo supervisorctl reread
# sudo supervisorctl update
# sudo supervisorctl start flowcrm-worker:*
